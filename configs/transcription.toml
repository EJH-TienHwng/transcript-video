[project]
root = "."
model = "models/faster-whisper-large-v3"

[hardware]
device = "cuda"
compute_type = "int8_float16"
video_encoder = "auto"

[transcription]
task = "transcribe"
language = "vi"
translation_batch_size = 8
overwrite_srt = false
skip_burn = false

[tts]
enabled = true
overwrite = false
mode = "timed"
generation_mode = "chunked"
model = "models/Qwen3-TTS-12Hz-1.7B-CustomVoice"
language = "English"
speaker = "Aiden"
instruct = "Calm, restrained professional narration for technical training. Use a steady medium pace, stable mid-range pitch, narrow pitch variation, even loudness, and consistent vocal energy. Keep the delivery neutral, controlled, and minimally expressive, with subtle natural intonation and no dramatic emphasis. Statements should sound settled and declarative, without conversational upspeak. Maintain the same speaking style across all lines, as if they belong to one continuous recording session. Speak clearly and read the provided text exactly."
attn_implementation = "sdpa"
audio_mode = "replace"
split_audio = true
chunk_minutes = 5
max_speedup = 1.15
chunk_tail_seconds = 10.0
context_max_sentences = 4
context_max_chars = 450
context_break_seconds = 3.0
