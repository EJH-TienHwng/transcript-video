required-version = ">=0.12.0"
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["data", "models"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
